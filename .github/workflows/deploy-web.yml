# Deploys ÆTHER MIL Web (web/app) to Cloudflare Pages project "aether-mil" on every push to main.
# Needs two repository secrets, added by a person: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy web
on:
  push:
    branches: [main]
    paths: ["web/app/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.40.0 pages deploy web/app --project-name aether-mil --branch main --commit-dirty=true
