[package]
name = "aether-core"
version = "0.1.0"
edition = "2021"
description = "ÆTHER shared security core: identity, Noise sessions, message envelopes and the encrypted vault."
license = "UNLICENSED"
publish = false

[lib]
name = "aether_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.3", features = ["cli"] }
thiserror = "1.0.69"
snow = { version = "0.9.6", default-features = false, features = ["default-resolver"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
chacha20poly1305 = "0.10.1"
sha2 = "0.10.8"
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.14.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
